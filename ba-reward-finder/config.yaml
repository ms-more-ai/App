# BA Reward Flight Finder — User Configuration

# Origin airport code
origin: LHR

# Destination airport codes to search
destinations:
  - JFK
  - NRT
  - SYD

# Date range to search (inclusive, YYYY-MM format)
date_range:
  start: "2026-03"
  end: "2026-08"

# Trip duration range in days (for return flight searches)
travel_duration:
  min_days: 5
  max_days: 14

# Passenger counts
passengers:
  adults: 2
  children: 0

# Cabin classes to check
cabin_classes:
  - economy    # World Traveller
  - business   # Club World

# Delay between agent runs (seconds) — randomised within this range
delay:
  min_seconds: 10
  max_seconds: 30

# Maximum retries per search task before marking as failed
max_retries: 2
